# ==============================================================================
# Docker Compose Configuration - Production & Security Hardened
# Sinh viên: Ma Thị Thanh Tú - MSSV: DTC245200587
# Hệ thống Quản lý Phòng khám (Clinic DevOps)
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # Database Service (PostgreSQL 16)
  # Hardening: Cách ly hoàn toàn trong mạng backend (internal: true), không mở cổng
  # --------------------------------------------------------------------------
  db:
    image: postgres:16.4
    container_name: clinic_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-clinic_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:-PgExporterClinic2026Sec}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic_admin} -d ${POSTGRES_DB:-clinic}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  # --------------------------------------------------------------------------
  # Web Application Service (Flask + Gunicorn)
  # Hardening: Non-root user (appuser 1001), read-only fs, tmpfs /tmp, cap_drop ALL
  # --------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: clinic_web
    restart: unless-stopped
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 1.0
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-clinic}
      DB_USER: ${APP_DB_USER:-clinic_app}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: production
      FLASK_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # --------------------------------------------------------------------------
  # Database Administration (pgAdmin 4)
  # Hardening: Chạy user pgadmin (5050), chỉ nối mạng frontend và backend
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: clinic_pgadmin
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dtc245200587@ictu.edu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # --------------------------------------------------------------------------
  # Reverse Proxy (Nginx Unprivileged)
  # Hardening: Non-root user (101:101), read-only fs, cap_drop ALL, Rate limiting
  # --------------------------------------------------------------------------
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: clinic_nginx
    restart: unless-stopped
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - frontend

  # --------------------------------------------------------------------------
  # Monitoring: Prometheus
  # Hardening: Non-root user nobody (65534), cách ly trong mạng monitoring internal
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: clinic_prometheus
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring

  # --------------------------------------------------------------------------
  # Monitoring: Grafana
  # Hardening: Non-root user (472:472), security_opt no-new-privileges
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.1
    container_name: clinic_grafana
    restart: unless-stopped
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://192.168.30.128/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend
      - monitoring

  # --------------------------------------------------------------------------
  # Container Metrics: cAdvisor
  # Ghi chú: Yêu cầu root/privileged để đọc cgroups và docker filesystem
  # --------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: clinic_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  # --------------------------------------------------------------------------
  # Nginx Exporter
  # Hardening: Non-root user (1001:1001), cap_drop ALL
  # --------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: clinic_nginx_exporter
    restart: unless-stopped
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.2
    command:
      - -nginx.scrape-uri=http://nginx:8080/nginx_status
    depends_on:
      - nginx
    networks:
      - frontend
      - monitoring

  # --------------------------------------------------------------------------
  # PostgreSQL Exporter
  # Hardening: Non-root user nobody (65534), cap_drop ALL
  # --------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: clinic_postgres_exporter
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.2
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${PG_EXPORTER_PASSWORD:-PgExporterClinic2026Sec}@db:5432/${POSTGRES_DB:-clinic}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - monitoring

  # --------------------------------------------------------------------------
  # Log Aggregation: Loki
  # Hardening: Non-root user (10001:10001), mạng monitoring internal
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.7
    container_name: clinic_loki
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    networks:
      - monitoring

  # --------------------------------------------------------------------------
  # Log Shipper: Promtail
  # Ghi chú: Yêu cầu root để đọc docker log socket và /var/lib/docker/containers
  # --------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.6.8
    container_name: clinic_promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    depends_on:
      - loki
    networks:
      - monitoring

  # --------------------------------------------------------------------------
  # Alert Sink Microservice
  # Hardening: Non-root user appuser (10002), read-only fs, tmpfs /tmp và /var/log
  # --------------------------------------------------------------------------
  alert-sink:
    build:
      context: ./alert-sink
      dockerfile: Dockerfile
    image: clinic-alert-sink:1.0
    container_name: clinic_alert_sink
    restart: unless-stopped
    user: "10002:10002"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/log:rw,noexec,nosuid,size=32m
    mem_limit: 128m
    cpus: 0.3
    networks:
      - monitoring

volumes:
  db_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  frontend:
    name: clinic_frontend
    driver: bridge
  backend:
    name: clinic_backend
    driver: bridge
    internal: true
  monitoring:
    name: clinic_monitoring
    driver: bridge
    internal: true

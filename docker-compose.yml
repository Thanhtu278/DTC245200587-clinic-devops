services:
  db:
    image: postgres:16.4
    container_name: clinic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-clinic_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic_admin} -d ${POSTGRES_DB:-clinic}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - clinic_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: clinic_web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-clinic}
      DB_USER: ${APP_DB_USER:-clinic_app}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinic_net

  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: clinic_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dtc245200587@ictu.edu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinic_net

  nginx:
    image: nginx:1.27-alpine
    container_name: clinic_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - clinic_net

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: clinic_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - clinic_net

  grafana:
    image: grafana/grafana:13.2.1
    container_name: clinic_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://192.168.30.128/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - clinic_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: clinic_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - clinic_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: clinic_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx/nginx_status
    depends_on:
      - nginx
    networks:
      - clinic_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: clinic_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${POSTGRES_EXPORTER_PASSWORD}@db:5432/${POSTGRES_DB:-clinic}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinic_net

volumes:
  db_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

networks:
  clinic_net:
    driver: bridge
